<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile Dock</title><style>
:root{
 color-scheme:light dark;font:14px/1.55 system-ui,"Segoe UI","Microsoft YaHei UI",sans-serif;
 --bg:#f6f7f9;--surface:#fff;--subtle:#f5f6f8;--hover:#edf0f4;--ink:#20252e;
 --muted:#576273;--line:#dce1e8;--control-line:#cdd4df;--accent:#354fba;
 --tint:#edf1ff;--tint-line:#d6dfff;--primary:#344cad;--primary-hover:#263c94;--on-primary:#fff;
 --good:#14764d;--medium:#8a560d;--low:#ad343f;--shadow:0 2px 4px #16213c08;
}
@media(prefers-color-scheme:dark){:root{
 --bg:#16171b;--surface:#1f2127;--subtle:#252830;--hover:#2e333d;--ink:#f2f4f8;
 --muted:#adb6c7;--line:#343842;--control-line:#484e5b;--accent:#b3c2ff;
 --tint:#252d47;--tint-line:#3b4870;--primary:#bfccff;--primary-hover:#d4ddff;--on-primary:#1c2a60;
 --good:#75d5a4;--medium:#f2bc72;--low:#ff9aa2;--shadow:none;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink)}
main{display:grid;gap:14px;max-width:720px;margin:auto;padding:clamp(12px,3.5vw,26px)}
header,section{min-width:0;border:1px solid var(--line);border-radius:15px;background:var(--surface);box-shadow:var(--shadow);padding:clamp(14px,3.4vw,20px)}
header{background:linear-gradient(135deg,var(--tint) 0%,var(--surface) 72%);border-color:var(--tint-line)}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{display:grid;place-items:center;flex:none;width:42px;height:42px;border:1px solid var(--tint-line);border-radius:12px;background:var(--surface);color:var(--accent)}
.brand-mark svg{width:23px;height:23px}
.eyebrow{margin:0;color:var(--accent);font-size:.75rem;font-weight:650;letter-spacing:.07em}
h1,h2,p{margin:0}
h1{font-size:clamp(20px,4.8vw,25px);line-height:1.3;font-weight:700}
h2{font-size:1.12rem;line-height:1.4;font-weight:700;overflow-wrap:anywhere}
.status,.note,.usage,.empty-state{color:var(--muted);font-size:.875rem;overflow-wrap:anywhere}
.status{position:relative;white-space:pre-line;margin-top:14px;padding-inline-start:15px}
.status::before{content:"";position:absolute;left:0;top:.52em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
#startup{margin-top:4px;padding-inline-start:15px}
button,input{font:inherit;min-height:38px;border:1px solid var(--control-line);border-radius:8px;background:var(--surface);color:var(--ink)}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 11px;font-weight:600;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){background:var(--hover)}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.primary:hover:not(:disabled){background:var(--primary-hover);border-color:var(--primary-hover)}
.icon{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px 14px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:12px}
.toolbar,.account-actions,.actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.refresh,.switch{color:var(--accent);background:var(--tint);border-color:var(--tint-line)}
#profiles{display:grid;gap:8px}
.empty-state{padding:14px 10px;text-align:center;background:var(--subtle);border-radius:9px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:11px}
.account-actions{justify-content:flex-end}
.account-label{display:flex;align-items:center;gap:9px;min-width:0;overflow-wrap:anywhere}
.quota{display:inline-flex;align-items:center;gap:5px;flex:none;width:calc(22px + 6ch);color:var(--quota-color,var(--muted));font-size:.8rem;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.quota[data-state=good]{--quota-color:var(--good)}.quota[data-state=medium]{--quota-color:var(--medium)}.quota[data-state=low]{--quota-color:var(--low)}
.quota-ring{position:relative;width:17px;height:17px;flex:none;border-radius:50%;background:conic-gradient(var(--quota-color,var(--muted)) var(--quota-progress,0%),var(--line) 0)}
.quota-ring::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--surface)}
.quota[data-state=unknown] .quota-ring{border:1.5px dashed var(--muted);background:none}
.quota[data-state=unknown] .quota-ring::after{display:none}
.usage{grid-column:1/-1;display:grid;gap:5px;margin:0;padding:8px 10px;border-radius:7px;background:var(--subtle)}
.usage-windows{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,165px),1fr));gap:7px 14px;margin:0}
.usage-window{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:baseline;gap:0 8px}
.usage-window dt{color:var(--ink);font-weight:600}
.usage-window dd{margin:0}
.usage-window .reset{grid-column:1/-1}
.usage-meta{font-size:.8rem}
.usage-error,#rename-error{color:var(--low)}
.form{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
input{min-width:0;flex:1 1 140px;padding:7px 10px;background:var(--subtle)}
label{display:block;margin-top:10px;font-size:.875rem;font-weight:600}
.note{margin-top:8px}
.actions{margin-top:12px}
#rename,#confirm{border-color:var(--tint-line)}
#rename-error{margin-top:8px;overflow-wrap:anywhere}
#rename-error:empty{display:none}
#confirm p{overflow-wrap:anywhere}
#question{margin-top:8px;font-weight:650}
.privacy{display:flex;align-items:flex-start;gap:7px;margin:0 3px 4px}
.privacy .icon{margin-top:2px}
@media(max-width:395px){
 .row{grid-template-columns:minmax(0,1fr)}
 .account-actions{justify-content:flex-start}
}
</style><main>
<header>
 <div class="brand">
  <span class="brand-mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M8 3h10a3 3 0 0 1 3 3v10"/><rect x="3" y="6" width="15" height="15" rx="4"/><circle cx="10.5" cy="11.5" r="2"/><path d="M6.5 17a4.6 4.6 0 0 1 8 0"/></svg></span>
  <div><p class="eyebrow">Profile Dock</p><h1 data-i18n="title"></h1></div>
 </div>
 <p id="status" class="status" role="status" aria-live="polite"></p>
 <p id="startup" class="status" role="status" hidden></p>
</header>
<section aria-labelledby="profiles-title">
 <div class="top">
  <h2 id="profiles-title" data-i18n="saved_accounts"></h2>
  <div class="toolbar">
   <button id="probe" disabled><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8h3l2-4 3 8 2-4h3"/></svg><span data-i18n="test_worker"></span></button>
   <button id="refresh" class="refresh" disabled><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 6A5.7 5.7 0 1 0 13 11.3M13.5 2.8V6h-3.2"/></svg><span id="refresh-label"></span></button>
  </div>
 </div>
 <div id="profiles"><p class="empty-state" data-i18n="connecting_local"></p></div>
</section>
<section id="rename" hidden aria-labelledby="renameTitle">
<h2 id="renameTitle"></h2>
<form id="rename-form" novalidate>
<label for="rename-alias" data-i18n="new_alias"></label>
<div class="form"><input id="rename-alias" maxlength="32" autocomplete="off" spellcheck="false"></div>
<p id="rename-error" role="alert"></p>
<div class="actions"><button type="submit" id="rename-save" class="primary" data-i18n="save_alias"></button><button type="button" id="rename-cancel" data-i18n="cancel"></button></div>
</form></section>
<section id="confirm" hidden aria-labelledby="confirmTitle"><h2 id="confirmTitle" data-i18n="confirm_title"></h2><p id="question"></p>
<p class="note" data-i18n="confirm_note"></p><div class="actions"><button id="yes" class="primary" data-i18n="continue"></button><button id="no" data-i18n="cancel"></button></div></section>
<section aria-labelledby="save-title"><h2 id="save-title" data-i18n="save_title"></h2><label for="alias" data-i18n="alias_label"></label><div class="form"><input id="alias" maxlength="32" autocomplete="off" spellcheck="false"><button id="save" class="primary" disabled data-i18n="save_account"></button></div>
<p class="note" data-i18n="save_note"></p></section>
<p class="note privacy"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.2" y="7" width="9.6" height="6.5" rx="1.5"/><path d="M5.4 7V5a2.6 2.6 0 0 1 5.2 0v2M8 9.6v1.4"/></svg><span data-i18n="privacy"></span></p>
</main><script>

 probe_failed:["Background check failed","后台自检未通过"],

 rename_incomplete:["The last rename did not complete.","上次重命名未完成。"],
 rename_interrupted:["The last rename was interrupted. Refresh the list to check.","上次重命名已中断，请刷新列表核对。"],

 confirm_switch:["Switch to “{name}”?","切换到「{name}」？"],
 confirm_save:["Save the current sign-in as “{name}”?","将当前登录保存为「{name}」？"],
 probe_manual:["Testing the background task…","正在测试后台启动，不会退出 Codex 或改动账号…"],

};

let language, dateFormat, percentFormat, durations, lastProfiles, refreshProgress, checkingProfile;
let statusMessage=["connecting"], renameMessage=null;

function t(key, values={}){
 const variants=Object.hasOwn(messages,key)?messages[key]:messages.operation_failed;
 return variants[language==="zh"?1:0].replace(/\{(\w+)\}/g,(_,name)=>String(values[name]??""));
}

function applyLocale(locale){
 const next=/^zh(?:[-_]|$)/i.test(locale??"")?"zh":"en";
 if(language===next)return;
 language=next;
 document.documentElement.lang=next==="zh"?"zh-CN":"en";
 dateFormat=new Intl.DateTimeFormat(next==="zh"?"zh-CN":"en-US",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
 percentFormat=new Intl.NumberFormat(next,{maximumFractionDigits:1});
 durations=Object.fromEntries(["day","hour","minute"].map(unit=>[unit,new Intl.NumberFormat(next,{style:"unit",unit,unitDisplay:"long"})]));
 for(const node of document.querySelectorAll("[data-i18n]"))node.textContent=t(node.dataset.i18n);
 $("status").textContent=t(...statusMessage);
 renderRefreshLabel();
 renderEditors();
 if(lastProfiles){
  showStartup(lastProfiles.startup);
  renderProfiles(lastProfiles);
 }
}

function renderRefreshLabel(){
 $("refresh-label").textContent=refreshProgress?t("refresh_progress",refreshProgress):t("refresh");
}

function renderEditors(){
 $("renameTitle").textContent=renaming?t("rename_target",{name:renaming}):t("rename_title");
 $("rename-error").textContent=renameMessage?t(...renameMessage):"";
 if(proposal)$("question").textContent=t(proposal.action==="Switch"?"confirm_switch":"confirm_save",{name:proposal.name});
}
function request(method,params={},timeoutMs=15000){
 return new Promise((resolve,reject)=>{
  const id="dock-"+(++seq),timeout=setTimeout(()=>{pending.delete(id);reject(Error("panel_timeout"));},timeoutMs);
  pending.set(id,{resolve,reject,timeout});parent.postMessage({jsonrpc:"2.0",id,method,params},"*");
 });
}
window.addEventListener("message",event=>{
 if(event.source!==parent||event.data?.jsonrpc!=="2.0")return;
 const m=event.data;
 if(m.method==="ui/notifications/host-context-changed"&&typeof m.params?.locale==="string"){
  applyLocale(m.params.locale);
  return;
 }
 if(Object.hasOwn(m,"id")&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);clearTimeout(p.timeout);m.error?p.reject(Error("request_failed")):p.resolve(m.result);}
});
function status(key, values){
 statusMessage=[key,values];
 $("status").textContent=t(...statusMessage);
}
function showError(error){status(error.message,{reason:error.reason});}
const usageErrors=new Map();
function controls(){
 const locked=busy||!!proposal||usageLoading||renaming!==null||renameBusy;
 $("probe").disabled=!connected||locked;
 $("refresh").disabled=!connected||locked;$("save").disabled=!connected||locked;
 $("alias").disabled=locked;document.querySelectorAll("[data-switch],[data-rename]").forEach(b=>b.disabled=locked);
 $("rename-alias").disabled=renameBusy;$("rename-cancel").disabled=renameBusy;
 $("rename-save").disabled=renameBusy||!renaming||$("rename-alias").value.trim()===renaming;
}
async function tool(name,args={}){
 const r=await request("tools/call",{name,arguments:args},name==="rename_profile"?22000:15000);
 if(r.isError){
  const failure=r._meta?.panelError;
  throw Object.assign(Error(failure?.code??"operation_failed"),{reason:failure?.reason});
 }
 return r._meta?.panel??{};
}
function usageErrorCode(code){
 return typeof code==="string"&&code.startsWith("usage_")&&Object.hasOwn(messages,code)?code:"usage_unavailable";
}
function durationLabel(minutes, index){
 if(minutes===null)return t("usage_window",{index});
 if(minutes%1440===0)return durations.day.format(minutes/1440);
 if(minutes%60===0)return durations.hour.format(minutes/60);
 return durations.minute.format(minutes);
}
function renderUsage(summary,snapshot,errorCode){
 if(summary.dataset.usageSummary===checkingProfile){
  summary.textContent=t("usage_checking");
  return;
 }
 if(snapshot){
  const windows=document.createElement("dl");windows.className="usage-windows";
  for(const [i,window] of snapshot.windows.entries()){
   const reset=window.resetsAt?window.resetsAt*1000:null;
   const item=document.createElement("div");item.className="usage-window";
   const term=document.createElement("dt");term.textContent=durationLabel(window.minutes,i+1);
   const value=document.createElement("dd");value.textContent=t("remaining",{percent:percentFormat.format(window.remaining)});
   item.append(term,value);
   if(reset!==null){
    const time=document.createElement("dd");time.className="reset usage-meta";
    time.textContent=reset<=Date.now()?t("reset_due"):t("reset_at",{time:dateFormat.format(reset)});
    item.append(time);
   }
   windows.append(item);
  }
  const checked=document.createElement("p");checked.className="usage-meta";
  checked.textContent=t("last_checked",{time:dateFormat.format(new Date(snapshot.checkedAt))});
  summary.append(windows,checked);
 }
 if(errorCode){const error=document.createElement("p");error.className="usage-error";error.textContent=t(usageErrorCode(errorCode));summary.append(error);}
 summary.hidden=!summary.hasChildNodes();
}
function quotaBadge(snapshot){
 const badge=document.createElement("span");badge.className="quota";badge.setAttribute("role","img");
 const ring=document.createElement("span");ring.className="quota-ring";ring.setAttribute("aria-hidden","true");
 badge.append(ring);
 if(!snapshot?.windows.length){
  badge.dataset.state="unknown";
  badge.append("—");
  badge.title=t("quota_unknown");
 }else{
  const remaining=Math.min(...snapshot.windows.map(window=>window.remaining));
  const stale=snapshot.windows.some(window=>window.resetsAt && window.resetsAt*1000<=Date.now());
  badge.dataset.state=stale?"stale":remaining<=20?"low":remaining<=50?"medium":"good";
  ring.style.setProperty("--quota-progress",remaining+"%");
  const percent=percentFormat.format(remaining);
  badge.append(percent+"%");
  badge.title=t(stale?"quota_stale":"quota_min",{percent});
 }
 badge.setAttribute("aria-label",badge.title);
 return badge;
}
function refresh(){
 if(proposal||renaming)return;
 refreshing??=loadProfiles().finally(()=>{refreshing=null;});
 return refreshing;
}
async function refreshAllUsage(){
 if(!connected||busy||proposal||usageLoading||renaming||renameBusy)return;
 usageLoading=true;controls();
 try{
  const data=await refresh();
  if(!data?.profiles?.length||data.busy)return;
  for(const [index,name] of data.profiles.entries()){
   refreshProgress={index:index+1,total:data.profiles.length};
   renderRefreshLabel();
   checkingProfile=name;
   usageErrors.delete(name);
   const summary=Array.from(document.querySelectorAll("[data-usage-summary]")).find(element=>element.dataset.usageSummary===name);
   if(summary){summary.hidden=false;summary.textContent=t("usage_checking");}
   try{await tool("refresh_usage",{name});}
   catch(error){usageErrors.set(name,usageErrorCode(error.message));}
  }
  checkingProfile=null;
  await refresh();
 }finally{
  usageLoading=false;refreshProgress=null;checkingProfile=null;renderRefreshLabel();controls();
 }
}
function showStartup(startup){
 const output=$("startup");
 if(!startup){output.hidden=true;return;}
 const probe=t(startup.probe==="passed"?"probe_passed":startup.probe==="failed"?"probe_failed":"probe_pending");
 const messages={
  running:startup.probe==="pending"?probe:t("startup_refreshing",{check:probe}),
  complete:startup.total?t("startup_complete",{check:probe,complete:startup.complete,total:startup.total}):probe,
  skipped:t("startup_skipped"),
  interrupted:t("startup_interrupted")
 };
 output.textContent=messages[startup.status]??"";
 output.hidden=!output.textContent;
}
function renderProfiles(data){
  $("profiles").replaceChildren();
  for(const name of data.profiles??[]){
   const row=document.createElement("div");row.className="row";
   const label=document.createElement("strong");label.textContent=name;
   const snapshot=Object.hasOwn(data.usage??{},name)?data.usage[name]:null;
   const identity=document.createElement("div");identity.className="account-label";identity.append(quotaBadge(snapshot),label);
   const button=document.createElement("button");button.className="switch";button.textContent=t("switch");button.dataset.switch="";
   button.setAttribute("aria-label",t("switch_to",{name}));button.onclick=()=>prepare("Switch",name);
   const actions=document.createElement("div");actions.className="account-actions";
   const rename=document.createElement("button");rename.textContent=t("rename");rename.dataset.rename=name;
   rename.setAttribute("aria-label",t("rename_account",{name}));rename.onclick=()=>openRename(name);
   actions.append(rename,button);
   const summary=document.createElement("div");summary.className="usage";summary.dataset.usageSummary=name;summary.setAttribute("role","status");
   const error=usageErrors.get(name)??(Object.hasOwn(data.usageErrors??{},name)?data.usageErrors[name]:null);
   renderUsage(summary,snapshot,error);
   row.append(identity,actions,summary);$("profiles").append(row);
  }
  if(!data.profiles?.length){
   const empty=document.createElement("p");empty.className="empty-state";empty.textContent=t("no_accounts");$("profiles").append(empty);
  }
  controls();
}
async function loadProfiles(){
 try{
  const data=await tool("list_profiles");busy=!!data.busy;
  lastProfiles=data;
  showStartup(data.startup);
  renderProfiles(data);
  const statuses={queued:"operation_queued",running:"operation_running",requested:"operation_requested",manual:"operation_manual",failed:"operation_incomplete",interrupted:"operation_interrupted"};
  const op=data.operation;
  if(op?.kind==="Rename")status({queued:"rename_queued",running:"rename_running",renamed:"rename_complete",failed:"rename_incomplete",interrupted:"rename_interrupted"}[op.status]??"verify_alias");
  else if(op?.status==="probe_ok")status("probe_ok");
  else if(op?.status==="failed" && op.reason!=="operation")status("worker_start_failed",{reason:op.reason||"startup"});
  else status(op ? statuses[op.status]??"verify_account" : "choose_account");
  return data;
 }catch(e){showError(e);}
}
async function prepare(action,name){
 if(busy||proposal||usageLoading||renaming||renameBusy)return;
 try{
  proposal=await tool("prepare_operation",{action,name:name.trim()});
  renderEditors();
  $("confirm").hidden=false;controls();$("no").focus();
 }catch(e){proposal=null;showError(e);controls();}
}
function focusRenameButton(name){
 Array.from(document.querySelectorAll("[data-rename]")).find(button=>button.dataset.rename===name)?.focus();
}
function openRename(name){
 if(busy||proposal||usageLoading||renaming||renameBusy)return;
 renaming=name;renameMessage=null;
 $("rename-alias").value=name;$("rename").hidden=false;
 renderEditors();
 controls();$("rename-alias").focus();$("rename-alias").select();
}
function closeRename(){
 const previous=renaming;
 renaming=null;$("rename").hidden=true;controls();
 return previous;
}
$("rename-alias").oninput=controls;
$("rename-cancel").onclick=()=>{if(!renameBusy)focusRenameButton(closeRename());};
$("rename-form").onkeydown=event=>{
 if(event.key==="Escape"&&!renameBusy){event.preventDefault();focusRenameButton(closeRename());}
};
$("rename-form").onsubmit=async event=>{
 event.preventDefault();
 if(!renaming||renameBusy)return;
 const name=renaming,newName=$("rename-alias").value.trim();
 if(!/^[A-Za-z0-9][A-Za-z0-9_-]{0,31}$/.test(newName)){
  renameMessage=["alias_invalid"];
  renderEditors();
  return;
 }
 if(name===newName)return;
 renameBusy=true;renameMessage=null;renderEditors();controls();
 try{
  await tool("rename_profile",{name,newName});
  usageErrors.delete(name);usageErrors.delete(newName);closeRename();
  await refresh();focusRenameButton(newName);
 }catch(error){renameMessage=[error.message,{reason:error.reason}];renderEditors();}
 finally{renameBusy=false;controls();}
};
$("save").onclick=()=>prepare("Save",$("alias").value);
$("refresh").onclick=refreshAllUsage;
$("probe").onclick=async()=>{
 if(busy||proposal||usageLoading||renaming||renameBusy)return;
 busy=true;controls();status("probe_manual");
 try {await tool("probe_worker");await refresh();}
 catch(e){busy=false;controls();showError(e);}
};
$("no").onclick=()=>{proposal=null;$("confirm").hidden=true;controls();};
$("yes").onclick=async()=>{
 if(!proposal)return;
 const ticket=proposal.ticket;$("yes").disabled=true;$("no").disabled=true;
 try{
  await tool("start_operation",{ticket});proposal=null;$("confirm").hidden=true;busy=true;controls();
  status("restart_requested");setTimeout(refresh,1200);
 }catch(e){showError(e);proposal=null;$("confirm").hidden=true;controls();}
 finally{$("yes").disabled=false;$("no").disabled=false;}
};
applyLocale(document.documentElement.lang);
(async()=>{
 try{
  const initialized=await request("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"Profile Dock",version:"0.8.3"},appCapabilities:{}});
  applyLocale(initialized?.hostContext?.locale||document.documentElement.lang);
  parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}},"*");
  connected=true;await refresh();poll=setInterval(()=>{if(!usageLoading)void refresh();},3500);
 }catch(e){showError(e);}
})();
window.addEventListener("pagehide",()=>clearInterval(poll));
</script></html>
