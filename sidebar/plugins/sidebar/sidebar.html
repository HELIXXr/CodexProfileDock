<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile Dock</title><style>
:root{color-scheme:light dark;font:15px/1.6 system-ui,sans-serif;--ink:#19213b;--muted:#55617b;--bg:#f2f4fa;--card:white;--line:#e0e4ef;--accent:#4846ae}
@media(prefers-color-scheme:dark){:root{--ink:#f1f2ff;--muted:#bdc4dc;--bg:#191b27;--card:#252938;--line:#41475c;--accent:#bfc0ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}main{max-width:680px;margin:auto;padding:clamp(16px,4vw,36px)}
header{background:#252a57;color:white;padding:24px;border-radius:16px}header .eyebrow{margin:0;color:#d4d6ff;font-size:.75rem;letter-spacing:.12em}h1{margin:4px 0 0;font-size:28px}
section{margin-top:16px;padding:20px;border:1px solid var(--line);background:var(--card);border-radius:16px}h2{font-size:1.05rem;margin:0 0 12px}
small,p.note{color:var(--muted)}button,input{font:inherit;border-radius:8px;padding:10px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.account-label{display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.quota{display:inline-flex;align-items:center;gap:5px;flex:none;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.quota[data-state=good]{--quota-color:#178451}.quota[data-state=medium]{--quota-color:#a96613}.quota[data-state=low]{--quota-color:#c14649}
@media(prefers-color-scheme:dark){.quota[data-state=good]{--quota-color:#5cce92}.quota[data-state=medium]{--quota-color:#f3b966}.quota[data-state=low]{--quota-color:#f18388}}
.quota-ring{position:relative;width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--quota-color,var(--muted)) var(--quota-progress,0%),var(--line) 0)}
.quota-ring::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--card)}
.quota[data-state=unknown] .quota-ring{border:1.5px dashed var(--muted);background:none}
.quota[data-state=low]{color:var(--quota-color)}
.usage{flex-basis:100%;margin:0;color:var(--muted);font-size:.875rem;white-space:pre-line;overflow-wrap:anywhere}
.primary{background:#4946ac;color:white;border-color:#4946ac}.form{display:flex;gap:10px;flex-wrap:wrap}input{min-width:150px;flex:1}#status{margin:10px 0 0;color:#e2e4ff;font-size:.875rem;white-space:pre-line;overflow-wrap:anywhere}.error{color:var(--accent)}
#confirm{border:2px solid var(--accent)}#confirm p{overflow-wrap:anywhere}.actions{display:flex;gap:10px;margin-top:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
</style><main>
<header><p class="eyebrow">PROFILE DOCK / LOCAL</p><h1>Codex 账号切换</h1>
<p id="status" role="status" aria-live="polite">正在连接…</p></header>
<section><div class="top"><h2>已保存账号</h2><div class="actions" style="margin-top:0"><button id="probe" disabled>测试后台</button><button id="refresh" disabled>刷新</button></div></div><div id="profiles">正在连接本机服务…</div></section>
<section id="confirm" hidden aria-labelledby="confirmTitle"><h2 id="confirmTitle">确认操作</h2><p id="question"></p>
<p>请先保存工作，等待其他任务完成。Codex 会退出并自动重开，当前面板会关闭。</p><div class="actions"><button id="yes" class="primary">确认并继续</button><button id="no">取消</button></div></section>
<section><h2>保存当前账号</h2><label for="alias">本地别名（例如 Personal）</label><div class="form"><input id="alias" maxlength="32" autocomplete="off"><button id="save" disabled>保存账号</button></div>
<p class="note">保存也会退出并重开 Codex，以便保存最新登录状态。</p></section>
<p class="note">登录令牌保存在本机加密文件中，不会发送给聊天模型。操作后请核对 Codex 当前账号。</p>
</main><script>
const $=s=>document.getElementById(s),pending=new Map();let seq=0,connected=false,busy=false,proposal=null,poll=null,refreshing=null,usageLoading=false;
function request(method,params={}){
 return new Promise((resolve,reject)=>{
  const id="dock-"+(++seq),timeout=setTimeout(()=>{pending.delete(id);reject(Error("服务响应超时，请刷新面板。"));},15000);
  pending.set(id,{resolve,reject,timeout});parent.postMessage({jsonrpc:"2.0",id,method,params},"*");
 });
}
window.addEventListener("message",event=>{
 if(event.source!==parent||event.data?.jsonrpc!=="2.0")return;
 const m=event.data;
 if(Object.hasOwn(m,"id")&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);clearTimeout(p.timeout);m.error?p.reject(Error(m.error.message??"请求失败")):p.resolve(m.result);}
});
function status(text){$("status").textContent=text;}
const usageErrors=new Map();
function controls(){
 const locked=busy||!!proposal||usageLoading;
 $("probe").disabled=!connected||locked;
 $("refresh").disabled=!connected||locked;$("save").disabled=!connected||locked;
 $("alias").disabled=locked;document.querySelectorAll("[data-switch]").forEach(b=>b.disabled=locked);
}
async function tool(name,args={}){
 const r=await request("tools/call",{name,arguments:args});
 if(r.isError)throw Error(r.content?.find(c=>c.type==="text")?.text??"操作失败");
 return r._meta?.panel??{};
}
const dateFormat=new Intl.DateTimeFormat("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
const percentFormat=new Intl.NumberFormat("zh-CN",{maximumFractionDigits:1});
const usageMessages={
 usage_auth_unavailable:"无法读取此账号的登录快照。",
 usage_cli_unavailable:"未找到可运行的 Codex App Server。",
 usage_expired:"登录快照已过期。请用此账号登录 Codex，保存后再查询。",
 usage_no_windows:"OpenAI 没有返回此账号的额度窗口。",
 usage_timeout:"额度查询超时，请重试。",
 usage_profile_missing:"账号记录已不存在。",
 usage_busy:"账号操作正在进行，请稍后再查。"
};
function usageText(snapshot,message){
 const lines=[];
 if(snapshot){
  for(const [i,window] of snapshot.windows.entries()){
   const mins=window.minutes;
   const label=mins===null?"额度窗口 "+(i+1):mins%1440===0?mins/1440+" 天":mins%60===0?mins/60+" 小时":mins+" 分钟";
   const reset=window.resetsAt?window.resetsAt*1000:null;
   const resetText=reset===null?"":reset<=Date.now()?" · 已到重置时间": " · "+dateFormat.format(reset)+" 重置";
   lines.push(label+" · 剩余 "+percentFormat.format(window.remaining)+"%"+resetText);
  }
  lines.push("上次查询 "+dateFormat.format(new Date(snapshot.checkedAt)));
 }
 if(message)lines.push(message);
 return lines.join("\n");
}
function quotaBadge(snapshot){
 const badge=document.createElement("span");badge.className="quota";badge.setAttribute("role","img");
 const ring=document.createElement("span");ring.className="quota-ring";ring.setAttribute("aria-hidden","true");
 badge.append(ring);
 if(!snapshot?.windows.length){
  badge.dataset.state="unknown";
  badge.append("—");
  badge.title="尚无额度数据";
 }else{
  const remaining=Math.min(...snapshot.windows.map(window=>window.remaining));
  const stale=snapshot.windows.some(window=>window.resetsAt && window.resetsAt*1000<=Date.now());
  badge.dataset.state=stale?"stale":remaining<=20?"low":remaining<=50?"medium":"good";
  ring.style.setProperty("--quota-progress",remaining+"%");
  const text=percentFormat.format(remaining)+"%";
  badge.append(text);
  badge.title=(stale?"上次查询最低剩余 ":"各窗口中最低剩余 ")+text+(stale?"，已到重置时间":"");
 }
 badge.setAttribute("aria-label",badge.title);
 return badge;
}
function refresh(){
 if(proposal)return;
 refreshing??=loadProfiles().finally(()=>{refreshing=null;});
 return refreshing;
}
async function refreshAllUsage(){
 if(!connected||busy||proposal||usageLoading)return;
 usageLoading=true;controls();
 try{
  const data=await refresh();
  if(!data?.profiles?.length||data.busy)return;
  const summaries=Array.from(document.querySelectorAll("[data-usage-summary]"));
  for(const [index,name] of data.profiles.entries()){
   $("refresh").textContent="刷新 "+(index+1)+"/"+data.profiles.length;
   usageErrors.delete(name);
   const summary=summaries.find(element=>element.dataset.usageSummary===name);
   if(summary){summary.hidden=false;summary.textContent="正在查询额度…";}
   try{await tool("refresh_usage",{name});}
   catch(error){usageErrors.set(name,usageMessages[error.message]??"暂时无法查询额度，请重试。");}
  }
  await refresh();
 }finally{
  usageLoading=false;$("refresh").textContent="刷新";controls();
 }
}
async function loadProfiles(){
 try{
  const data=await tool("list_profiles");busy=!!data.busy;
  $("profiles").replaceChildren();
  for(const name of data.profiles??[]){
   const row=document.createElement("div");row.className="row";
   const label=document.createElement("strong");label.textContent=name;
   const snapshot=Object.hasOwn(data.usage??{},name)?data.usage[name]:null;
   const identity=document.createElement("div");identity.className="account-label";identity.append(quotaBadge(snapshot),label);
   const button=document.createElement("button");button.textContent="切换";button.dataset.switch="";
   button.setAttribute("aria-label","切换到 "+name);button.onclick=()=>prepare("Switch",name);
   const summary=document.createElement("p");summary.className="usage";summary.dataset.usageSummary=name;summary.setAttribute("role","status");
   summary.textContent=usageText(snapshot,usageErrors.get(name));summary.hidden=!summary.textContent;
   row.append(identity,button,summary);$("profiles").append(row);
  }
  if(!data.profiles?.length)$("profiles").textContent="还没有保存的账号。";
  const statuses={queued:"正在确认本机后台启动…",running:"正在退出并处理账号，Codex 会暂时关闭。",requested:"上次账号操作已完成，并已请求重开 Codex。请核对当前账号。",manual:"账号操作已完成，请手动打开 Codex 并核对账号。",failed:"上次操作未完成。请确认 Codex 已完全退出后再试；账号状态以 Codex 实际显示为准。",interrupted:"上次操作被中断。未自动重试，请先核对当前账号。"};
  const op=data.operation;
  if(op?.status==="probe_ok")status("后台自检通过。没有退出 Codex，也没有改动账号。");
  else if(op?.status==="failed" && op.reason!=="operation")status("后台启动未完成，账号未改变。诊断代码："+(op.reason||"startup"));
  else status(op ? statuses[op.status]??"请核对账号。" : "请选择账号，或保存当前登录。");
  controls();
  return data;
 }catch(e){status(e.message);}
}
async function prepare(action,name){
 if(busy||proposal||usageLoading)return;
 try{
  proposal=await tool("prepare_operation",{action,name:name.trim()});
  $("question").textContent=action==="Switch"?"切换到「"+proposal.name+"」？":"将当前登录保存为「"+proposal.name+"」？";
  $("confirm").hidden=false;controls();$("no").focus();
 }catch(e){proposal=null;status(e.message);controls();}
}
$("save").onclick=()=>prepare("Save",$("alias").value);
$("refresh").onclick=refreshAllUsage;
$("probe").onclick=async()=>{
 if(busy||proposal||usageLoading)return;
 busy=true;controls();status("正在测试后台启动，不会退出 Codex 或改动账号…");
 try {await tool("probe_worker");await refresh();}
 catch(e){busy=false;controls();status(e.message);}
};
$("no").onclick=()=>{proposal=null;$("confirm").hidden=true;controls();};
$("yes").onclick=async()=>{
 if(!proposal)return;
 const ticket=proposal.ticket;$("yes").disabled=true;$("no").disabled=true;
 try{
  await tool("start_operation",{ticket});proposal=null;$("confirm").hidden=true;busy=true;controls();
  status("已交给本机后台。Codex 即将退出，请等待重开。");setTimeout(refresh,1200);
 }catch(e){status(e.message);proposal=null;$("confirm").hidden=true;controls();}
 finally{$("yes").disabled=false;$("no").disabled=false;}
};
(async()=>{
 try{
  await request("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"Profile Dock",version:"0.6.0"},appCapabilities:{}});
  parent.postMessage({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}},"*");
  connected=true;await refresh();poll=setInterval(()=>{if(!usageLoading)void refresh();},3500);
 }catch(e){status(e.message);}
})();
window.addEventListener("pagehide",()=>clearInterval(poll));
</script></html>
