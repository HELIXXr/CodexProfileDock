name: macOS verification

on:
  push:
    branches: [macos-beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check the account transaction
        run: node sidebar/plugins/sidebar/test-macos.mjs
      - name: Check the installer and native Keychain worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/dock-tools" @openai/codex@0.155.1
          export PATH="$RUNNER_TEMP/dock-tools/node_modules/.bin:$PATH"
          keychain="$RUNNER_TEMP/profile-dock-fixture.keychain-db"
          security create-keychain -p 'profile-dock-ci-fixture' "$keychain"
          security unlock-keychain -p 'profile-dock-ci-fixture' "$keychain"
          security set-keychain-settings -lut 600 "$keychain"
          security default-keychain -d user -s "$keychain"
          security list-keychains -d user -s "$keychain"

          # Security.framework reads keychain preferences from the runner’s actual home.
          export CODEX_HOME="$RUNNER_TEMP/Profile Dock Test User/.codex"
          mkdir -p "$CODEX_HOME"
          printf '%s\n' 'cli_auth_credentials_store = "file"' > "$CODEX_HOME/config.toml"
          bash sidebar/macos/Install-Profile-Dock.command
          bash sidebar/macos/Install-Profile-Dock.command
          node sidebar/macos/test-native.mjs
          bash sidebar/macos/Uninstall-Profile-Dock.command
          bash sidebar/macos/Uninstall-Profile-Dock.command
          test -x "$HOME/Library/Application Support/CodexProfileDock/bin/profile-dock-native"
